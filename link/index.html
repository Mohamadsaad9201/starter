<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connect your account · Impackt Media</title><link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root{--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--ok:#059669;--okbg:#ecfdf5;--err:#9f1239;--errbg:#fff1f2}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Geist,Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:26px}.brand img{height:22px;filter:brightness(0)}
h1{font-size:24px;line-height:1.25;letter-spacing:-.02em;margin:0 0 10px;font-weight:600}
p{margin:0 0 16px;color:var(--ink2)}
ul{margin:0 0 22px;padding:0;list-style:none;display:grid;gap:8px}li{display:flex;gap:10px;color:var(--ink2);font-size:14px}li:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:7px;flex:none}
label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:14px}input{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
button{width:100%;min-height:48px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 15px/1 inherit;font-family:inherit;cursor:pointer}button:hover{background:#1e293b}button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.note{font-size:13px;color:var(--muted);margin:14px 0 0}
.state{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;margin-bottom:18px}.state.ok{background:var(--okbg);color:#065f46}.state.err{background:var(--errbg);color:var(--err)}
.state b{display:block}.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#d1fae5;flex:none;font-weight:700}
.err .ic{background:#ffe4e6}
</style>
<link rel="stylesheet" href="/brand-direction.css"><link rel="stylesheet" href="/launch-polish.css"><link rel="stylesheet" href="/interactions.css"><link rel="stylesheet" href="/brand-site.css?v=12.1"></head>
<body>
<main><div class="card" id="app" aria-live="polite"><div class="brand"><img src="/assets/wordmark.svg" alt="Impackt Media"></div><p>Loading…</p></div></main>
<script src="/config.js"></script>
<script>
(() => {
  const CFG = window.SEO_ENGINE, app = document.getElementById("app");
  const q = new URLSearchParams(location.search), token = q.get("t") || "";
  const result = q.get("connected") ? { ok: q.get("ok") === "1", msg: q.get("msg") || "" } : null;
  if (result) history.replaceState(null, "", location.pathname + "?t=" + token);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const call = (action, extra = {}) => fetch(`${CFG.supabaseUrl}/functions/v1/connect-link`, { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.supabaseAnonKey }, body: JSON.stringify({ action, token, ...extra }) }).then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok || j.error) throw new Error(j.error || "Something went wrong. Try the link again."); return j; });
  const brand = '<div class="brand"><img src="/assets/wordmark.svg" alt="Impackt Media"></div>';
  const SHARES = {
    google: ["Search clicks, impressions and rankings for your website", "Read-only. Nothing in your Google account changes"],
    google_ads: ["Campaign spend, clicks and conversions", "Changes are only ever made after the business approves them"],
    meta_ads: ["Facebook & Instagram ad spend and results", "Changes are only ever made after the business approves them"],
    shopify: ["Orders and products, to report sales and repeat customers", "Approved store edits, each one reversible"],
  };
  function render(info, err) {
    if (err) { app.innerHTML = brand + `<div class="state err"><span class="ic">!</span><div><b>This link can't be used</b>${esc(err)}</div></div><p class="note">Ask the person who sent it for a new link.</p>`; return; }
    if (info.state === "connected" || (result && result.ok)) {
      app.innerHTML = brand + `<div class="state ok"><span class="ic">✓</span><div><b>${esc(info.name)} is connected</b>${esc(result?.msg || "Thank you. " + info.business + " can now see these numbers.")}</div></div><p class="note">You can close this page.</p>`; return;
    }
    if (info.state === "expired") { render(null, "This link expired."); return; }
    const shop = info.provider === "shopify";
    app.innerHTML = brand + (result && !result.ok ? `<div class="state err"><span class="ic">!</span><div><b>That didn't finish</b>${esc(result.msg || "The connection was cancelled.")} You can try again.</div></div>` : "") +
      `<h1>Connect ${esc(info.name)} for ${esc(info.business)}</h1><p>${esc(info.business)} asked you to connect this account so their results show real numbers. It takes a minute, and you don't need an account here.</p>
      <ul>${(SHARES[info.provider] || []).map((x) => `<li>${esc(x)}</li>`).join("")}<li>You can remove access at any time from your ${esc(info.name.split(" (")[0])} settings</li></ul>
      ${shop ? '<label>Store address<input id="shop" placeholder="your-store.myshopify.com" autocomplete="off"></label>' : ""}
      <button id="go">Continue with ${esc(info.name.split(" (")[0])}</button><p class="note">You'll sign in on ${esc(info.name.split(" (")[0])}'s own page and approve access there.</p>`;
    document.getElementById("go").onclick = async (e) => {
      const b = e.currentTarget; b.disabled = true; b.textContent = "Opening…";
      try { const r = await call("start", shop ? { shop: document.getElementById("shop").value } : {}); location.href = r.url; }
      catch (x) { b.disabled = false; b.textContent = "Try again"; const p = document.createElement("p"); p.className = "note"; p.style.color = "#9f1239"; p.textContent = x.message; b.after(p); }
    };
  }
  if (!/^[0-9a-f]{48}$/.test(token)) { render(null, "This link is incomplete."); return; }
  call("info").then((i) => render(i)).catch((e) => render(null, e.message));
})();
</script>
<script src="/interactions.js" defer></script></body>
</html>
